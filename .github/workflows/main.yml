name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-macos:
    name: Test (macOS, swift test)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - name: Build
        run: swift build -v
      - name: Run tests
        run: swift test -v

  test-ios:
    name: Test (iOS Simulator)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - name: Build and test on iOS Simulator
        run: |
          xcodebuild test \
            -scheme AsyncPrimitivesKit \
            -destination "platform=iOS Simulator,name=iPhone 15,OS=latest"
